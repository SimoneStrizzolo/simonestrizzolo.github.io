<header class="site-header">
  <div class="container nav-wrap">
    <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
    <nav class="main-nav">
      <ul>
        {% for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
