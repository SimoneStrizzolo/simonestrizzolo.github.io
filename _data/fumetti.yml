    Il Beyonder, entità cosmica onnipotente, rapisce i più grandi eroi e
    villain della Terra e li trasporta su Battleworld, un pianeta artificiale
    creato assemblando pezzi di mondi diversi, promettendo di realizzare ogni
    desiderio a chi vincerà la guerra. Doctor Destino emerge come minaccia
