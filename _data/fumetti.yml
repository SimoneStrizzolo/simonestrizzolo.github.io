    gran parte degli Avengers, Hawkeye lo uccide con una freccia in un patto
    stabilito tra i due. Il conflitto culmina in uno scontro diretto tra
    Stark e Danvers, al termine del quale Stark cade in coma e il futuro
    degli eroi resta diviso.
