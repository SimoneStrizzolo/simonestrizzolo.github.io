  fumetti: "Daredevil: The Man Without Fear (1993) 1-5"
  autori: [Frank Miller, John Romita Jr.]
  posseduto: false
  link: "https://www.panini.it/shp_ita_it/daredevil-l-uomo-senza-paura-mmust007isbn-it08.html"
  immagini:
    - src: /assets/img/marvel-must-have/daredevil-luomo-senza-paura.jpg
      alt: "Daredevil: L'Uomo senza Paura - copertina"
  trama: >
    La già difficile vita del giovane Matt Murdock cambia per sempre quando un
    incidente lo priva della vista. Quel giorno, però, nasce un eroe, dotato di
