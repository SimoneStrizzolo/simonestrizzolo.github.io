- id: wolverine-arma-x
  titolo: "Wolverine: Arma X"
  anno: 1988
  edizione: Marvel Must Have
  fumetti: "Marvel Comics Presents (1988) 72-84"
  autori: [Barry Windsor-Smith]
  posseduto: false
  link: "https://www.panini.it/shp_ita_it/wolverine-arma-x-mmust043isbn-it08.html"
  immagini:
    - src: /assets/img/marvel-must-have/wolverine-arma-x.jpg
      alt: "Wolverine: Arma X - copertina"
  trama: >
    Wolverine ha rappresentato molte cose per altrettante persone, ma per
    qualcuno era solo un'arma… e le armi possono uccidere! Il passato dell'uomo
    noto come Logan è pieno di misteri, e quello più tragico sta per venire
    alla luce. La risposta alla domanda che i fan si sono posti per anni: chi
    ha ricoperto di adamantio lo scheletro di Wolverine? Il mutante artigliato
    come non lo avevate mai visto, in una delle storie Marvel non soltanto più
    importanti, ma anche più drammatiche di sempre, frutto del genio di un
    maestro dei comics come Barry Windsor-Smith.
