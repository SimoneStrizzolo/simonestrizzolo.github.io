    dei più grandi autori Marvel di tutti i tempi!

- id: daredevil-diavolo-custode
  titolo: "Daredevil: Diavolo Custode"
  anno: 1998
  edizione: Marvel Must Have
  fumetti: "Daredevil vol. 2 (1998) 1-8"
  autori: [Kevin Smith, Joe Quesada, Jimmy Palmiotti]
  posseduto: false
  link: "https://www.panini.it/shp_ita_it/daredevil-diavolo-custode-mmust039isbn-it08.html"
  immagini:
    - src: /assets/img/marvel-must-have/daredevil-diavolo-custode.jpg
      alt: "Daredevil: Diavolo Custode - copertina"
  trama: >
    Una ragazza in fuga. Un bambino che secondo alcuni è l'Anticristo. Un amico
    accusato di un terribile delitto. Hanno tutti bisogno di qualcuno che li
    aiuti e che vegli su di loro. Di un… diavolo custode? Ma Matt Murdock sarà
    all'altezza del compito o sprofonderà lentamente nella pazzia? Dal regista
    di Clerks Kevin Smith e dal fuoriclasse Joe Quesada, una saga semplicemente
    fondamentale che ha condotto Daredevil nel XXI secolo e lo ha fatto scoprire
    a una nuova generazione di lettori.

