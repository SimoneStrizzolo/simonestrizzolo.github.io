- id: aftermath
  titolo: "Aftermath"
  personaggi: [Norra Wexley, Wedge Antilles, Rae Sloane]
  anno: 2015
  edizione: Star Wars Narrativa
  autori: [Chuck Wendig]
  link: "https://starwarslibricomics.it/2015/09/10/recensione-aftermath/"
  trama: >
    Sei mesi dopo la Battaglia di Endor, Wedge Antilles viene catturato
    mentre indaga su un raduno segreto di gerarchi imperiali su Akiva. Norra
    Wexley risponde al suo richiamo e, insieme al figlio Temmin, all'ex
    ufficiale imperiale Sinjir Rath Velus, alla cacciatrice di taglie Jas
    Emari e al droide Mr. Bones, forma un gruppo per sventare il piano. La
    missione riesce a impedire la riorganizzazione imperiale sul pianeta, ma
    gli intermezzi narrativi mostrano che l'Impero si sta riorganizzando su
    altri fronti, con alcuni agenti oscuri già a caccia della spada laser di
    Vader: il romanzo pone così le basi verso "Il Risveglio della Forza".
  immagini:
    - src: /assets/img/starwars/aftermath.jpg
      alt: "Aftermath - copertina"
  collegate: [aftermath-debito-di-vita]

- id: stelle-perdute
  titolo: "Stelle Perdute"
  personaggi: [Thane Kyrell, Ciena Ree]
  anno: 2015
  edizione: Star Wars Romanzi (Panini)
  autori: [Claudia Gray]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-stelle-perdute-mswro080isbn-it08.html"
  trama: >
    Thane Kyrell, aristocratico, e Ciena Ree, di origini rurali, crescono
    insieme su Jelucan legati dalla passione per il volo e si arruolano
    entrambi come cadetti imperiali. Le loro strade si dividono quando
    Thane, disgustato dalla brutalità dell'Impero, diserta per unirsi
    all'Alleanza Ribelle, mentre Ciena resta fedele al suo giuramento
    nonostante i dubbi crescenti. Il romanzo culmina nella Battaglia di
    Jakku, lo scontro finale che segna il crollo dell'Impero: Ciena, pilota
    fino all'ultimo per lealtà, viene infine catturata dai Ribelli e detenuta
    come criminale di guerra. Il finale resta agrodolce, con Ciena
    determinata a scontare le conseguenze delle proprie scelte senza aver
    rinunciato al proprio senso dell'onore.
  immagini:
    - src: /assets/img/starwars/stelle-perdute.jpg
      alt: "Stelle Perdute - copertina"
  collegate: []

- id: tarkin
  titolo: "Tarkin"
  personaggi: [Wilhuff Tarkin, Darth Vader, Imperatore Palpatine]
  anno: 2014
  edizione: Star Wars Narrativa
  autori: [James Luceno]
  link: "https://starwarslibricomics.it/2016/08/12/recensione-tarkin/"
  trama: >
    Ambientato 14 anni prima della Battaglia di Yavin, il romanzo segue
    Wilhuff Tarkin mentre l'Imperatore Palpatine lo assegna, insieme a Darth
    Vader, a indagare sul furto della sua corvetta personale, la Carrion
    Spike, sottratta da un gruppo di dissidenti separatisti superstiti. I due
    inseguono la nave rubata di sistema in sistema, affrontando il caso con
    metodi opposti: Tarkin con analisi metodica, Vader seguendo le tracce del
    Lato Oscuro. Lunghi flashback raccontano l'infanzia di Tarkin a Eriadu e
    la sua rapida ascesa nei ranghi militari. Nel finale i dissidenti vengono
    catturati e la loro cospirazione sventata, consolidando la fiducia di
    Palpatine in Tarkin, che pochi anni dopo verrà nominato Grand Moff e
    messo a capo della Morte Nera.
  immagini:
    - src: /assets/img/starwars/tarkin.jpg
      alt: "Tarkin - copertina"
  collegate: [i-signori-dei-sith]

- id: una-nuova-alba
  titolo: "Una Nuova Alba"
  personaggi: [Kanan Jarrus, Hera Syndulla]
  anno: 2014
  edizione: Star Wars Romanzi (Panini)
  autori: [John Jackson Miller]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-una-nuova-alba-mswro055isbn-it08.html"
  trama: >
    Sul pianeta industriale Gorse, l'ex Jedi Kanan Jarrus vive nascondendo il
    proprio passato per sopravvivere sotto l'Impero, finché la morte di un
    amico lo spinge a ribellarsi. Si allea con la pilota Hera Syndulla per
    fermare il conte Denetrius Vidian, un amministratore imperiale disposto
    a far saltare in aria la luna Cynda per accelerare l'estrazione di
    minerale, mettendo a rischio l'intero pianeta. Nello scontro finale
    Vidian muore e il piano distruttivo viene sventato. L'esperienza condivisa
    spinge Kanan a riscoprire la propria identità di Jedi e a unirsi
    definitivamente a Hera, gettando le basi della futura squadra della Ghost
    vista in Star Wars Rebels.
  immagini:
    - src: /assets/img/starwars/una-nuova-alba.jpg
      alt: "Una Nuova Alba - copertina"
  collegate: [star-wars-ahsoka]

- id: battlefront-la-compagnia-twilight
  titolo: "Battlefront: la Compagnia Twilight"
  personaggi: [Hazram Namir, Micha "Howl" Evon, Everi Chalis]
  anno: 2015
  edizione: Multiplayer.it Edizioni
  autori: [Alexander Freed]
  link: "https://starwarslibricomics.it/2016/11/17/star-wars-battlefront-compagnia-twilight-multiplayer-it-edizioni/"
  trama: >
    La Compagnia Twilight, un'unità di fanteria ribelle logorata da anni di
    guerra, è comandata dal capitano Micha "Howl" Evon e dal sergente Hazram
    Namir. Durante una missione la squadra recupera Everi Chalis, un'ex
    governatrice imperiale disgraziata dopo la distruzione della Morte Nera,
    che offre informazioni in cambio di asilo, dando inizio a una campagna di
    sabotaggio segnata da sospetti reciproci sulla sua lealtà. Durante una
    conferenza strategica su Hoth, Howl muore in un attacco imperiale e Namir
    assume il comando. Nello scontro finale su Sullust la compagnia
    sopravvive grazie alla tattica di Chalis e alla sollevazione popolare
    della città, consolidando Namir come nuovo comandante.
  immagini:
    - src: /assets/img/starwars/battlefront-la-compagnia-twilight.jpg
      alt: "Battlefront: la Compagnia Twilight - copertina"
  collegate: []

- id: erede-dei-jedi
  titolo: "L'Erede dei Jedi"
  personaggi: [Luke Skywalker, Nakari Kelen]
  anno: 2015
  edizione: Star Wars Narrativa
  autori: [Kevin Hearne]
  link: "https://starwarslibricomics.it/2016/12/22/recensione-l-erede-dei-jedi/"
  trama: >
    Ambientato tra gli Episodi IV e V, il romanzo segue Luke Skywalker in tre
    missioni per l'Alleanza Ribelle: valutare della mercanzia su Rodia,
    recuperare creature aliene dal pianeta Fex insieme a Nakari Kelen e,
    infine, su incarico dell'Ammiraglio Ackbar, estrarre dall'Impero una
    crittografa Givin. Luke porta a termine con successo l'ultima missione,
    garantendo alla Ribellione l'accesso alle capacità della crittografa. La
    vicenda si chiude senza svolte drammatiche di rilievo per il
    protagonista, con un tono episodico e a basso impatto sulla continuity
    generale.
  immagini:
    - src: /assets/img/starwars/erede-dei-jedi.jpg
      alt: "L'Erede dei Jedi - copertina"
  collegate: []

- id: i-signori-dei-sith
  titolo: "I Signori dei Sith"
  personaggi: [Darth Vader, Imperatore Palpatine, Cham Syndulla]
  anno: 2015
  edizione: Star Wars Romanzi (Panini)
  autori: [Paul S. Kemp]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-i-signori-dei-sith-mswro073isbn-it08.html"
  trama: >
    Palpatine e Darth Vader si recano su Ryloth per stroncare la resistenza
    del movimento Free Ryloth, guidato da Cham Syndulla e dalla luogotenente
    Isval. Un'imboscata dei ribelli distrugge la loro nave e li costringe a
    sopravvivere nella landa ostile del pianeta, dando a Vader l'occasione di
    dimostrare al suo Maestro il proprio valore uccidendo senza pietà chiunque
    incontri. Nello scontro finale Vader decapita Isval, mentre Palpatine
    ordina di eliminare anche i civili testimoni nascosti in una miniera, per
    non lasciare traccia dell'accaduto. Cham Syndulla riesce a fuggire ma la
    resistenza di Ryloth viene duramente colpita: l'episodio consolida il
    legame di fiducia tra Palpatine e Vader.
  immagini:
    - src: /assets/img/starwars/i-signori-dei-sith.jpg
      alt: "I Signori dei Sith - copertina"
  collegate: [tarkin]

- id: lapprendista-del-lato-oscuro
  titolo: "L'Apprendista del Lato Oscuro"
  personaggi: [Quinlan Vos, Asajj Ventress, Conte Dooku]
  anno: 2015
  edizione: Star Wars Romanzi (Panini)
  autori: [Christie Golden]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-l-apprendista-del-lato-oscuro-mswro063isbn-it08.html"
  trama: >
    Il Consiglio Jedi incarica il maestro Quinlan Vos di infiltrarsi nelle
    fila separatiste per assassinare il Conte Dooku, affiancandolo all'ex
    apprendista Sith Asajj Ventress, ormai cacciatrice di taglie. Durante la
    missione tra i due nasce un legame che sfocia in amore, ma Vos viene
    catturato da Dooku e corrotto al lato oscuro. Ventress si sacrifica per
    salvarlo, morendo tra le sue braccia e spezzando così il controllo di
    Dooku su di lui. Vos torna dai Jedi profondamente segnato dall'esperienza,
    avendo toccato il lato oscuro e perso l'amore della sua vita.
  immagini:
    - src: /assets/img/starwars/lapprendista-del-lato-oscuro.jpg
      alt: "L'Apprendista del Lato Oscuro - copertina"
  collegate: []

- id: aftermath-debito-di-vita
  titolo: "Aftermath: Debito di Vita"
  personaggi: [Han Solo, Chewbacca, Norra Wexley, Rae Sloane]
  anno: 2016
  edizione: Star Wars Narrativa
  autori: [Chuck Wendig]
  link: "https://starwarslibricomics.it/2017/03/01/recensione-aftermath-debito-di-vita/"
  trama: >
    Mentre la Nuova Repubblica dà la caccia ai resti dell'Impero, Han Solo e
    Chewbacca guidano la liberazione di Kashyyyk, ma scompaiono durante
    l'operazione; la squadra di Norra Wexley viene incaricata di ritrovarli
    mentre continua a dare la caccia ai leader imperiali in fuga. In
    parallelo, l'ammiraglio Rae Sloane cerca disperatamente di riunire l'alta
    gerarchia imperiale per evitare il collasso totale dell'Impero. Il
    romanzo si chiude con Han e Chewbacca liberati e Kashyyyk riconquistata
    per i Wookiee, ma con Sloane ancora libera e determinata a ricostruire il
    potere imperiale, gettando le basi per il futuro Primo Ordine.
  immagini:
    - src: /assets/img/starwars/aftermath-debito-di-vita.jpg
      alt: "Aftermath: Debito di Vita - copertina"
  collegate: [aftermath, aftermath-la-fine-dellimpero]

- id: aftermath-la-fine-dellimpero
  titolo: "Aftermath: la Fine dell'Impero"
  personaggi: [Norra Wexley, Rae Sloane, Gallius Rax, Leia Organa]
  anno: 2017
  edizione: Star Wars Narrativa
  autori: [Chuck Wendig]
  link: "https://starwarslibricomics.it/2017/03/21/recensione-aftermath-la-fine-dell-impero/"
  trama: >
    La squadra di Norra Wexley rintraccia il Grand Ammiraglio Rae Sloane sul
    pianeta desertico Jakku, dove scoprono la flotta imperiale superstite in
    orbita. Norra e Jas vengono catturate, mentre Temmin e Sinjir fuggono per
    avvertire Leia Organa e la Nuova Repubblica. Il vero artefice del piano è
    Gallius Rax, che ha manipolato l'Impero verso una battaglia decisiva per
    eseguire l'ultimo, segreto piano dell'Imperatore Palpatine. Il romanzo
    culmina nella Battaglia di Jakku, che segna la sconfitta definitiva
    dell'Impero e la sua trasformazione nei resti che diventeranno il Primo
    Ordine.
  immagini:
    - src: /assets/img/starwars/aftermath-la-fine-dellimpero.jpg
      alt: "Aftermath: la Fine dell'Impero - copertina"
  collegate: [aftermath-debito-di-vita]

- id: catalizzatore-un-romanzo-di-rogue-one
  titolo: "Catalizzatore: un romanzo di Rogue One"
  personaggi: [Galen Erso, Lyra Erso, Orson Krennic]
  anno: 2016
  edizione: Star Wars Romanzi (Panini)
  autori: [James Luceno]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-catalizzatore-un-romanzo-di-rogue-one-mswro052isbn-it08.html"
  trama: >
    Poco dopo l'inizio delle Guerre dei Cloni, lo scienziato Galen Erso viene
    salvato insieme alla moglie Lyra e alla piccola figlia Jyn da Orson
    Krennic, ufficiale ambizioso dell'Impero che lavora al progetto segreto
    della Morte Nera. Krennic usa il debito di gratitudine per attirare Galen
    nelle proprie ricerche, presentandogliele come pacifiche, mentre Lyra
    nutre crescenti sospetti. Quando scopre lo scopo bellico del progetto,
    Lyra convince Galen a fuggire; la famiglia riesce a scappare da Coruscant
    con l'aiuto del contrabbandiere Has Obitt. Krennic, screditato, perde il
    controllo del progetto in favore di Tarkin e resta deciso a ritrovare gli
    Erso, gettando le basi degli eventi di "Rogue One".
  immagini:
    - src: /assets/img/starwars/catalizzatore-un-romanzo-di-rogue-one.jpg
      alt: "Catalizzatore: un romanzo di Rogue One - copertina"
  collegate: []

- id: leia-principessa-di-alderaan
  titolo: "Leia, Principessa di Alderaan"
  personaggi: [Leia Organa, Bail Organa, Breha Organa]
  anno: 2017
  edizione: Star Wars Narrativa
  autori: [Claudia Gray]
  link: "https://starwarslibricomics.it/2018/07/09/recensione-leia-principessa-di-alderaan/"
  trama: >
    Per il suo sedicesimo compleanno, Leia deve superare tre prove per
    diventare a pieno titolo principessa di Alderaan, scoprendo nel frattempo
    che i suoi genitori adottivi, Bail e Breha Organa, stanno segretamente
    costruendo un movimento di resistenza contro l'Impero. Viene reclutata da
    Mon Mothma dopo aver scoperto una base ribelle segreta. Quando l'Impero
    pianifica di distruggere la flotta nascente dell'Alleanza, Leia avverte
    suo padre; nell'evacuazione, per proteggere la Rebellion, mente
    all'Impero e fa schiantare una nave per eliminare le prove. Superata
    l'ultima prova, viene proclamata erede legittima al trono di Alderaan.
  immagini:
    - src: /assets/img/starwars/leia-principessa-di-alderaan.jpg
      alt: "Leia, Principessa di Alderaan - copertina"
  collegate: [legami-di-sangue]

- id: legami-di-sangue
  titolo: "Legami di Sangue"
  personaggi: [Leia Organa, Han Solo, Ammiraglio Ackbar]
  anno: 2016
  edizione: Star Wars Romanzi (Panini)
  autori: [Claudia Gray]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-legami-di-sangue-mswro056isbn-it08.html"
  trama: >
    Sei anni prima de "Il Risveglio della Forza", la senatrice Leia Organa
    indaga su un cartello criminale e scopre dietro di esso un'organizzazione
    ben più vasta: il Primo Ordine, formato da lealisti imperiali. Mentre la
    sua candidatura a Prima Senatrice guadagna terreno, un'agente del Primo
    Ordine rivela pubblicamente che Darth Vader era suo padre, scatenando uno
    scandalo che distrugge la sua candidatura. Convinta che il Senato sia
    irrimediabilmente incapace di reagire alle minacce, Leia fonda
    segretamente la Resistenza insieme a vecchi alleati come l'ammiraglio
    Ackbar, gettando le basi degli eventi che precederanno "Il Risveglio della
    Forza".
  immagini:
    - src: /assets/img/starwars/legami-di-sangue.jpg
      alt: "Legami di Sangue - copertina"
  collegate: [leia-principessa-di-alderaan]

- id: star-wars-ahsoka
  titolo: "Ahsoka"
  personaggi: [Ahsoka Tano, Bail Organa]
  anno: 2016
  edizione: Star Wars Romanzi (Panini)
  autori: [E.K. Johnston]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-ahsoka-mswro043isbn-it08.html"
  trama: >
    Un anno dopo la Vendetta dei Sith, Ahsoka Tano vive in fuga sotto falsa
    identità, fino a rifugiarsi sulla luna Raada dove si lega alla comunità
    contadina locale. Quando l'Impero impone brutali cambiamenti agricoli,
    Ahsoka guida una resistenza, esponendo però i suoi poteri della Forza e
    attirando l'Inquisitore Sesto Fratello. Dopo che questi rapisce
    un'amica di Ahsoka, lei lo affronta in duello e lo uccide, recuperandone
    i cristalli kyber con cui forgia le sue iconiche spade laser a lama
    bianca. Bail Organa evacua la popolazione di Raada e recluta Ahsoka nella
    nascente Alleanza Ribelle, segnando il suo definitivo ritorno alla lotta
    contro l'Impero.
  immagini:
    - src: /assets/img/starwars/star-wars-ahsoka.jpg
      alt: "Ahsoka - copertina"
  collegate: [una-nuova-alba]

- id: thrawn
  titolo: "Thrawn"
  personaggi: [Thrawn, Eli Vanto, Arihnda Pryce]
  anno: 2017
  edizione: Star Wars Romanzi (Panini)
  autori: [Timothy Zahn]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-thrawn-1-mswro017isbn-it08.html"
  trama: >
    Thrawn, un Chiss ritrovato in esilio nello Spazio Selvaggio, viene
    reclutato dall'Impero e affianca Eli Vanto, destinato a diventarne
    interprete. Le sue capacità tattiche attirano l'attenzione dell'Imperatore
    Palpatine, mentre indaga su sabotaggi orchestrati da un misterioso capo
    della resistenza noto come Nightswan. Nel finale la governatrice Arihnda
    Pryce fa esplodere un complesso per occultare un omicidio, uccidendo così
    anche Nightswan e chiudendo la rivolta nel settore di Batonn. Pryce
    ottiene il governatorato di Lothal in cambio di prove compromettenti su
    altri ufficiali, mentre Thrawn, grazie ai risultati ottenuti, viene
    promosso e avviato verso la sua rapida ascesa nella flotta imperiale.
  immagini:
    - src: /assets/img/starwars/thrawn.jpg
      alt: "Thrawn - copertina"
  collegate: [thrawn-alleanze]

- id: phasma
  titolo: "Phasma"
  personaggi: [Phasma, Cardinal, Vi Moradi]
  anno: 2017
  edizione: Star Wars Narrativa
  autori: [Delilah S. Dawson]
  link: "https://starwarslibricomics.it/2019/06/18/recensione-phasma/"
  trama: >
    La spia della Resistenza Vi Moradi viene catturata e interrogata dal
    capitano Cardinal, che vuole scoprire il passato compromettente della
    capitana Phasma. Vi racconta come Phasma, guerriera del pianeta
    post-apocalittico Parnassos, abbia aiutato il generale Brendol Hux a
    raggiungere la sua nave precipitata uccidendo il proprio fratello e
    abbandonando la sua compagna per garantirsi la fuga verso il Primo
    Ordine, assistendo poi impassibile al bombardamento che distrugge
    Parnassos. Cardinal scopre che in realtà fu Phasma a uccidere Brendol Hux
    con un veleno, e la affronta in duello ma viene sconfitto e gravemente
    ferito. Vi fugge portando via Cardinal, e tra i due nasce un rispetto
    reciproco nato dal comune pericolo condiviso.
  immagini:
    - src: /assets/img/starwars/phasma.jpg
      alt: "Phasma - copertina"
  collegate: []

- id: le-leggende-di-luke-skywalker
  titolo: "Le Leggende di Luke Skywalker"
  personaggi: [Luke Skywalker]
  anno: 2017
  edizione: Star Wars Narrativa
  autori: [Ken Liu]
  link: "https://starwarslibricomics.it/2019/08/18/recensione-le-leggende-di-luke-skywalker/"
  trama: >
    Su una nave da carico in rotta verso Canto Bight, un gruppo di membri
    dell'equipaggio si scambia sei racconti leggendari su Luke Skywalker,
    discutendo se sia davvero esistito o solo un mito. Le storie arrivano da
    narratori improbabili, tra cui una pulce-talpa che sostiene di aver
    aiutato a salvare Han Solo e un soldato imperiale presente alla Battaglia
    di Jakku. Ogni racconto offre una versione diversa e contraddittoria di
    Luke, tra eroe Jedi, ciarlatano o addirittura mezzo droide, senza mai
    confermare quale sia la verità. Il libro si chiude senza risolvere
    l'ambiguità: la leggenda di Luke resta aperta, in preparazione tematica al
    personaggio in "Gli Ultimi Jedi".
  immagini:
    - src: /assets/img/starwars/le-leggende-di-luke-skywalker.jpg
      alt: "Le Leggende di Luke Skywalker - copertina"
  collegate: []

- id: star-wars-last-shot
  titolo: "Last Shot"
  personaggi: [Han Solo, Lando Calrissian, Leia Organa, Chewbacca]
  anno: 2018
  edizione: Star Wars Narrativa
  autori: [Daniel José Older]
  link: "https://starwarslibricomics.it/2019/08/31/star-wars-last-shot-del-rey/"
  trama: >
    Lando Calrissian e la droide L3-37, insieme al giovane Han Solo e
    Chewbacca, tentano di impossessarsi di un dispositivo capace di
    trasformare tutti i droidi della galassia in assassini, creato dal
    dottor Fyzen Gor. Dieci anni dopo, Han si è sposato con Leia Organa e ha
    abbandonato la vita da contrabbandiere, ma l'arrivo di Lando in fuga dagli
    scagnozzi di Gor lo riporta nel pericolo. Han e Lando riescono a
    distruggere il dispositivo e a sconfiggere Fyzen Gor, scongiurando la
    minaccia di una rivolta droidi su scala galattica. La vittoria costa
    comunque cara agli affetti di Han, che deve conciliare il richiamo
    dell'avventura con la vita familiare appena costruita con Leia e il
    piccolo Ben.
  immagini:
    - src: /assets/img/starwars/last-shot.jpg
      alt: "Last Shot - copertina"
  collegate: [legami-di-sangue]

- id: thrawn-alleanze
  titolo: "Thrawn: Alleanze"
  personaggi: [Thrawn, Darth Vader, Anakin Skywalker, Padmé Amidala]
  anno: 2018
  edizione: Star Wars Romanzi (Panini)
  autori: [Timothy Zahn]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-thrawn-alleanze-mswro020isbn-it08.html"
  trama: >
    L'Imperatore invia Darth Vader e il Grand'Ammiraglio Thrawn a investigare
    una misteriosa minaccia ai margini delle Regioni Ignote, costringendo i
    due rivali a un'alleanza forzata. In una linea temporale parallela,
    durante le Guerre dei Cloni, Anakin Skywalker incontra Thrawn su Batuu
    mentre cerca Padmé Amidala, scomparsa dopo un messaggio sulla trama
    separatista. Le due trame convergono verso la stessa minaccia comune. Nel
    finale Thrawn intuisce la vera identità di Vader e capisce che Vader
    sospetta che lui abbia capito, creando una tensione silenziosa e non
    risolta tra i due che li lega da allora in un patto tacito di reciproco
    sospetto.
  immagini:
    - src: /assets/img/starwars/thrawn-alleanze.jpg
      alt: "Thrawn: Alleanze - copertina"
  collegate: [thrawn, thrawn-tradimento]

- id: thrawn-tradimento
  titolo: "Thrawn: Tradimento"
  personaggi: [Thrawn, Eli Vanto, Orson Krennic, Wilhuff Tarkin]
  anno: 2019
  edizione: Star Wars Romanzi (Panini)
  autori: [Timothy Zahn]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-thrawn-tradimento-mswro003isbn-it08.html"
  trama: >
    Poche settimane dopo gli eventi di "Alleanze", Thrawn è coinvolto in uno
    scontro di potere tra il Direttore Orson Krennic e il Grand Moff Tarkin
    per il controllo dei fondi destinati al progetto dei TIE Defender.
    Mentre gestisce questa disputa politica, il suo ex protetto Eli Vanto lo
    raggiunge con l'allarme di un'infiltrazione delle forze Grysk che
    minaccia sia l'Ascendenza Chiss che l'Impero. Nel finale Thrawn smaschera
    e sconfigge la minaccia Grysk, ma il prezzo è un confronto diretto con la
    sua lealtà divisa. Il romanzo si chiude con un colloquio con l'Imperatore
    Palpatine che mette in luce quanto la fedeltà di Thrawn resti ambigua,
    concludendo la prima trilogia canonica dedicata al Grand'Ammiraglio.
  immagini:
    - src: /assets/img/starwars/thrawn-tradimento.jpg
      alt: "Thrawn: Tradimento - copertina"
  collegate: [thrawn-alleanze]

- id: thrawn-ascendenza-insorge-il-caos
  titolo: "Thrawn: l'Ascendenza 1 - Insorge il Caos"
  personaggi: [Thrawn, Ammiraglio Ar'alani, Generale Yiv il Benevolo]
  anno: 2020
  edizione: Star Wars Romanzi (Panini)
  autori: [Timothy Zahn]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-thrawn-l-ascendenza-1-mswro006isbn-it08.html"
  trama: >
    Nell'Ascendenza Chiss, il giovane e brillante ufficiale Thrawn viene
    incaricato di scoprire chi si cela dietro un attacco alla capitale,
    spingendosi con la flotta d'Espansione e l'aiuto dell'ammiraglio Ar'alani
    nella misteriosa regione del Caos. Scopre che dietro l'aggressione si
    muove il Destino Nikardun, guidato dal generale Yiv il Benevolo, una
    potenza espansionista che minaccia l'intera Ascendenza. Thrawn sventa il
    piano nikardun ma la vittoria espone la sua ambizione, inimicandogli
    rivali all'interno della sua stessa famiglia. Nel finale emerge la
    misteriosa figura di Jixtus, agente Grysk infiltrato per minare dall'
    interno la società chiss, gettando le basi per i libri successivi.
  immagini:
    - src: /assets/img/starwars/thrawn-ascendenza-insorge-il-caos.jpg
      alt: "Thrawn: l'Ascendenza 1 - Insorge il Caos - copertina"
  collegate: [thrawn-ascendenza-il-bene-superiore]

- id: thrawn-ascendenza-il-bene-superiore
  titolo: "Thrawn: l'Ascendenza 2 - Il Bene Superiore"
  personaggi: [Thrawn, Syndic Thurfian, Syndic Zistalmu]
  anno: 2020
  edizione: Star Wars Romanzi (Panini)
  autori: [Timothy Zahn]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-thrawn-l-ascendenza-2-mswro014isbn-it08.html"
  trama: >
    Dopo l'ascesa di prestigio della sua casata, Thrawn scopre che la vera
    minaccia per l'Ascendenza Chiss non è un'invasione militare ma un nemico
    che semina discordia tra le famiglie sovrane tramite doni e favori
    apparentemente disinteressati. Indagando su un possibile legame tra pirati
    e un'altra specie, Thrawn si impegna a salvare un gruppo di rifugiati
    convinti che il loro mondo sia stato distrutto. Sul fronte politico, il
    rivale Syndic Thurfian trama contro di lui diffondendo voci infondate. Il
    romanzo si chiude con Thurfian che diventa Patriarca della propria
    casata, rafforzando la sua posizione contro Thrawn e allargando la
    frattura tra le famiglie regnanti, in preparazione all'esilio di Thrawn
    nel terzo volume.
  immagini:
    - src: /assets/img/starwars/thrawn-ascendenza-il-bene-superiore.jpg
      alt: "Thrawn: l'Ascendenza 2 - Il Bene Superiore - copertina"
  collegate: [thrawn-ascendenza-insorge-il-caos, thrawn-ascendenza-3-guerra-minore]

- id: thrawn-ascendenza-3-guerra-minore
  titolo: "Thrawn: l'Ascendenza 3 - Guerra Minore"
  personaggi: [Thrawn, Thrass, Ammiraglio Ar'alani]
  anno: 2021
  edizione: Star Wars Romanzi (Panini)
  autori: [Timothy Zahn]
  link: "https://www.panini.it/shp_ita_it/star-wars-romanzi-thrawn-l-ascendenza-3-mswro024isbn-it08.html"
  trama: >
    L'Ascendenza Chiss è sull'orlo della guerra civile, corrosa dall'interno
    da un nemico che semina sfiducia tra le famiglie regnanti; Thrawn, per
    salvarla, è costretto a scavare nel passato oscuro della propria casata.
    Alla fine sconfigge Jixtus, l'agente dei Grysk, che si suicida attivando
    l'autodistruzione della sua nave dopo aver avvertito Thrawn che i Grysk
    torneranno per distruggere l'Ascendenza. Nonostante abbia salvato
    l'Ascendenza dalla guerra civile, il Consiglio ordina l'esilio di Thrawn
    nello Spazio Minore, privandolo del suo ruolo e separandolo dai suoi
    alleati, incluso Thrass, il fratello che perderà per sempre.
  immagini:
    - src: /assets/img/starwars/thrawn-ascendenza-il-male-minore.jpg
      alt: "Thrawn: l'Ascendenza 3 - Guerra Minore - copertina"
  collegate: [thrawn-ascendenza-il-bene-superiore]

- id: la-luce-dei-jedi
  titolo: "La Luce dei Jedi"
  personaggi: [Avar Kriss, Loden Greatstorm, Marchion Ro, Elzar Mann, Bell Zettifar]
  anno: 2021
  edizione: "Star Wars: L'Alta Repubblica (Panini Comics, ed. italiana)"
  autori: [Charles Soule]
  link: ""
  trama: >
    Duecento anni prima de "La Minaccia Fantasma", un disastro nell'iperspazio
    distrugge la nave Legacy Run e minaccia un intero sistema con una pioggia
    di detriti letali: i Jedi, guidati da Avar Kriss, si precipitano a salvare
    vite mentre la Repubblica scopre di non essere pronta a un evento del
    genere. Dietro il caos si muovono i Nihil, una coalizione di predoni
    capace di sfruttare rotte iperspaziali segrete, guidata da Marchion Ro,
    che ha da poco preso il controllo della misteriosa figura dell'Occhio dal
    padre. Nel finale emerge la svolta chiave: il disastro non è stato un
    incidente ma un attentato orchestrato deliberatamente da Ro con la sua
    tecnologia iperspaziale segreta, per creare il caos che gli permette di
    consolidare il potere sui Nihil trasformandoli da banda di pirati in una
    forza unificata; il maestro Jedi Loden Greatstorm viene catturato da Ro,
    che intende usarlo come esca per altri Jedi. La crisi immediata viene
    contenuta con l'inaugurazione del faro-avamposto Starlight Beacon, ma la
    minaccia dei Nihil resta viva e non sconfitta. Il libro si chiude con una
    visione inquietante del Jedi Elzar Mann, che vede suoi colleghi mutilati e
    sconfitti in battaglie future, presagio della fine della pace dell'Alta
    Repubblica e prologo diretto del romanzo successivo, "The Rising Storm" di
    Cavan Scott.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/la-luce-dei-jedi.jpg
      alt: "La Luce dei Jedi - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [star-wars-alta-repubblica-nelloscurita, rising-storm-cavan-scott]

- id: una-prova-di-coraggio
  titolo: "Una Prova di Coraggio"
  personaggi: [Vernestra Rwoh, Avon Starros, Imri Cantaros, Honesty Weft, J-6, Klinith Da, Gwishi]
  anno: 2021
  edizione: "Star Wars: L'Alta Repubblica (romanzo junior, Panini Comics / Disney-Lucasfilm Press)"
  autori: [Justina Ireland]
  link: ""
  trama: >
    La neo-Cavaliere Jedi Vernestra Rwoh scorta la giovane inventrice Avon
    Starros a bordo della Steady Wing, in rotta verso l'inaugurazione della
    stazione Faro Starlight, quando due agenti dei Nihil, Klinith Da e
    Gwishi, fanno esplodere ordigni sulla nave per sabotare l'espansione
    repubblicana nel settore di Dalna. Vernestra, Avon, il droide J-6, il
    padawan Imri Cantaros e Honesty Weft (figlio dell'ambasciatore di Dalna)
    fuggono su una scialuppa e si schiantano sulla luna giungla di Wevo, un
    ambiente ostile fra piogge acide e acqua tossica; nell'esplosione muoiono
    sia il Maestro di Imri, Douglas, sia il padre di Honesty, lasciando
    entrambi i ragazzi devastati dal lutto e dalla rabbia. Scoperto che i due
    Nihil sopravvissuti li stanno cacciando per finire il lavoro, Imri
    convince Honesty ad aiutarlo a vendicarsi, ma i due vengono catturati da
    Klinith Da e Gwishi. Vernestra li raggiunge con Avon e J-6, neutralizza i
    Nihil e affronta in duello alla spada laser lo stesso Imri, ormai
    accecato dalla sete di vendetta e vicino al lato oscuro, riuscendo a
    batterlo senza condannarlo per il suo cedimento. La vicenda si risolve
    con Vernestra che, dopo avergli lasciato sfogare il dolore, decide di
    prenderlo come suo padawan, gettando le basi per la crescita del ragazzo
    e per le sue future avventure nella saga dell'Alta Repubblica.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/una-prova-di-coraggio.jpg
      alt: "Una Prova di Coraggio - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [sfidare-la-tempesta]

- id: star-wars-alta-repubblica-nelloscurita
  titolo: "Nell'Oscurità"
  personaggi: [Reath Silas, Orla Jareni, Cohmac Vitas, Dez Rydan, Affie Hollow, Leox Gyasi, Nan, Marchion Ro]
  anno: 2021
  edizione: "Star Wars: L'Alta Repubblica (High Republic)"
  autori: [Claudia Gray]
  link: ""
  trama: >
    Il Padawan Reath Silas, sradicato da Coruscant per affiancare la maestra
    Jora Malli a Starlight Beacon, si ritrova coinvolto in un naufragio
    spaziale che lo porta, insieme ad altri Jedi e all'equipaggio della nave
    Vessel, su una misteriosa stazione Amaxine in apparenza abbandonata. Lì
    scoprono che antichi idoli Sith tengono imprigionati i Drengir, piante
    senzienti e voraci legate al lato oscuro, mentre la giovane Nan si rivela
    in realtà una spia dei Nihil, i pirati guidati da Marchion Ro. Nello
    scontro finale la maestra Jedi Jora Malli viene uccisa dai Nihil, e il
    Padawan Dez Rydan, torturato dai Drengir, resta con il legame alla Forza
    reciso. Reath riesce a espellere nello spazio sia i Nihil che i Drengir
    aprendo una chiusa della stazione, salvando la Vessel a rischio della
    propria vita. La vicenda si chiude con l'inaugurazione di Starlight Beacon
    come avamposto sicuro ai confini della Repubblica, mentre Marchion Ro
    giura vendetta contro i Jedi, gettando le basi per il conflitto che
    dominerà l'intera saga dell'Alta Repubblica.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/star-wars-alta-repubblica-nelloscurita.jpg
      alt: "Nell'Oscurità - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [la-luce-dei-jedi, rising-storm-cavan-scott]

- id: rising-storm-cavan-scott
  titolo: "Si Alza la Tempesta"
  personaggi: [Elzar Mann, Stellan Gios, Bell Zettifar, Loden Greatstorm, Ty Yorrick, Marchion Ro, Lourna Dee, Lina Soh, Rhil Dairo]
  anno: 2021
  edizione: "Star Wars: L'Alta Repubblica (High Republic) - Fase I"
  autori: [Cavan Scott]
  link: ""
  fumetti: ""
  trama: >
    Un anno dopo gli eventi de "La Luce dei Jedi", la Cancelliera Lina Soh
    organizza sul pianeta Valo la Fiera della Repubblica per celebrare l'unità
    della galassia, ma Marchion Ro, capo dei Nihil, libera un antico essere
    pietrificante chiamato il Grande Livellatore con l'intento di annientare
    l'Ordine Jedi. Durante la fiera la flotta Nihil piomba su Valo
    dall'hyperspazio, massacrando civili e Jedi e riducendo in coma la stessa
    Cancelliera Soh; il Jedi Elzar Mann e la cacciatrice di mostri Ty Yorrick
    riescono a contrastare l'assalto solo aprendosi a un lato più oscuro della
    Forza. Il padawan Bell Zettifar ritrova il suo maestro Loden Greatstorm
    ancora vivo ma trasformato in pietra dal Grande Livellatore: quando
    Stellan Gios lo tocca per pietà, Loden si disintegra in polvere, un
    momento che segna profondamente lo stesso Gios. I Nihil riescono a fuggire
    a bordo della Gaze Electric, anche se la tempest runner Lourna Dee viene
    capturata dopo aver tradito il suo alleato Pan Eyta. La giornalista Rhil
    Dairo trasmette la strage a tutta la galassia, rendendo pubblica la
    minaccia dei Nihil e lasciando i Jedi segnati da perdite pesanti e da un
    conflitto ancora lontano dalla soluzione.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/rising-storm-cavan-scott.jpg
      alt: "Si Alza la Tempesta - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [la-luce-dei-jedi, fuori-dalle-ombre, la-stella-caduta]

- id: fuori-dalle-ombre
  titolo: "Fuori dalle Ombre"
  personaggi: [Sylvestri Yarrow, Vernestra Rwoh, Imri Cantaros, Cohmac Vitus, Reath Silas]
  anno: 2021
  edizione: "Star Wars: L'Alta Repubblica (High Republic) — romanzo Young Adult"
  autori: [Justina Ireland]
  link: ""
  fumetti: ""
  trama: >
    Sylvestri Yarrow, giovane trasportatrice di merci, lotta per salvare
    l'attività di cargo di famiglia dopo la morte della madre, tra debiti
    crescenti e i violenti attacchi dei Nihil alle rotte commerciali.
    Cercando aiuto su Coruscant, Syl si ritrova invece coinvolta in una
    disputa territoriale tra le potenti famiglie San Tekka e Graf per il
    controllo di un settore di spazio apparentemente vuoto, missione
    affidata anche alla cavaliere Jedi Vernestra Rwoh, al suo padawan Imri
    Cantaros, al maestro Cohmac Vitus e al padawan Reath Silas. La svolta
    arriva quando la nave di Syl viene trascinata fuori dall'iperspazio dai
    Nihil: costretta ad abbandonare la Switchback, scopre che i Nihil stanno
    costruendo una superarma, e che a capo del progetto scientifico c'è sua
    madre, creduta morta. La rivelazione ribalta tutto ciò che Syl credeva
    della propria famiglia e la costringe a scegliere da che parte stare nel
    conflitto contro i Nihil. Il romanzo chiude alcune domande aperte da "La
    Tempesta si Alza" e getta le basi per gli sviluppi successivi della saga,
    sia sul fronte politico della Repubblica sia su quello della minaccia
    dei Nihil.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/fuori-dalle-ombre.jpg
      alt: "Fuori dalle Ombre - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [rising-storm-cavan-scott, la-stella-caduta]

- id: la-stella-caduta
  titolo: "La Stella Caduta"
  personaggi: [Marchion Ro, Avar Kriss, Elzar Mann, Stellan Gios, Bell Zettifar, Sskeer, Lourna Dee]
  anno: 2022
  edizione: "Star Wars Romanzi Vol. 16 (Panini Comics, collana Star Wars: L'Alta Repubblica)"
  autori: [Claudia Gray]
  link: ""
  trama: >
    Mentre i Jedi sono ancora scossi dall'attacco alla Fiera della Repubblica,
    Marchion Ro, la vera mente dei Nihil, scatena il suo colpo più ambizioso:
    un assalto pensato per spegnere per sempre la luce dei Jedi e affondare la
    Starlight Beacon, simbolo dell'Alta Repubblica. Avar Kriss è convinta di
    dare la caccia a Lourna Dee credendola l'Occhio dei Nihil, mentre Elzar
    Mann e Stellan Gios cercano di contenere il caos a bordo della stazione
    sotto assedio. Nello scontro decisivo il Jedi Trandoshan Sskeer si
    sacrifica per salvare i compagni, e la Starlight Beacon, ormai
    irrimediabilmente danneggiata, precipita e si inabissa nelle acque di
    Eiram davanti a tutta la galassia. Nel momento di massimo trionfo,
    Marchion Ro si svela pubblicamente come il vero Occhio dei Nihil,
    ribaltando ogni certezza sull'identità del nemico. Il romanzo chiude così
    la prima fase della saga dell'Alta Repubblica lasciando la Repubblica
    ferita, i Jedi in lutto e la strada aperta alla nuova fase della guerra
    contro i Nihil.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/la-stella-caduta.jpg
      alt: "La Stella Caduta - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [rising-storm-cavan-scott, fuori-dalle-ombre, occhio-delloscurita-mann]

- id: orizzonte-di-mezzanotte
  titolo: "Orizzonte di Mezzanotte"
  personaggi: [Reath Silas, Ram Jomaram, Cohmac Vitus, Kantam Sy, Zeen Mrala, Lula Talisola, "Alys \"Crash\" Ongwa", Krix Kamerat, Nomar Tralmat, Yoda]
  anno: 2022
  edizione: "Star Wars: L'Alta Repubblica (High Republic) - Fase I, romanzo YA"
  autori: [Daniel José Older]
  link: ""
  fumetti: "Star Wars: L'Alta Repubblica (High Republic)"
  trama: >
    Su Corellia, un finto allarme su un attacco Nihil porta i Jedi Cohmac
    Vitus, Kantam Sy e i loro padawan Reath Silas, Ram Jomaram, Zeen Mrala e
    Lula Talisola a scoprire un complotto ben più insidioso: Nomar Tralmat,
    un potente Padre della Città di Coronet, collabora in segreto con i Nihil
    per rubare incrociatori Purgill della Repubblica. Mentre il gruppo di
    giovani, affiancato dall'investigatrice Crash e ostacolato dall'ex amico
    di Zeen ormai passato ai Nihil, Krix Kamerat, indaga tra i bassifondi
    corelliani, il complotto degenera in violenza aperta: Dizcaro si
    sacrifica per proteggere Ovus dai colpi di blaster di Tralmat, che viene
    poi ucciso dalla capoclan Grindalid Mother Fastidima dopo aver confessato
    l'omicidio dell'agente Prybolt. I Nihil riescono comunque a impossessarsi
    di parte delle navi rubate e a lanciare un assalto diretto contro
    Starlight Beacon, che viene gravemente colpita, con numerosi Jedi dati
    per morti, tra cui la stessa Lula. Solo l'intervento improvviso di Yoda,
    che abbatte da solo la nave nemica e ribalta le sorti della battaglia,
    salva la stazione dalla distruzione totale. Il romanzo si chiude con
    Reath nominato Cavaliere Jedi ma subito travolto da nuovi sconvolgimenti,
    con Cohmac che abbandona l'Ordine Jedi, e con Yoda che porta prove di
    una minaccia inedita per l'intera galassia, capace di scuotere l'Ordine
    dalle fondamenta e che spingerà tutti i Jedi a raccogliersi su Coruscant.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/orizzonte-di-mezzanotte.jpg
      alt: "Orizzonte di Mezzanotte - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: []

- id: star-wars-alta-repubblica-il-sentiero-dellinganno
  titolo: "Il Sentiero dell'Inganno"
  personaggi: [Marda Ro, Kevmo Zink, Zallah Macri, Yana Ro, "Elecia (\"la Madre\")", Kor]
  anno: 2023
  edizione: "Star Wars Romanzi (Panini Comics), vol. 26 - L'Alta Repubblica: Fase II"
  autori: [Tessa Gratton, Justina Ireland]
  link: ""
  fumetti: "romanzo"
  trama: >
    Sul pianeta Dalna, la Jedi Zallah Macri e il suo Padawan Kevmo Zink
    indagano sul furto di un manufatto della Forza collegato al Sentiero
    della Mano Aperta, un culto che considera sacrilego il controllo della
    Forza da parte di chiunque, Jedi compresi. Marda Ro, giovane Evereni
    cresciuta nel Sentiero, si innamora di Kevmo senza sapere che è un Jedi,
    ma la scoperta la spinge a una crisi di lealtà proprio mentre la leader
    del culto, "la Madre" (Elecia), rivela un piano ben più sinistro: uccidere
    i Jedi per impossessarsi dei manufatti. La Madre usa una creatura simile a
    un Livellatore per calcificare in pietra Zallah e Kevmo, e nello scontro
    muore anche la giovane Nautolana Kor. Sopraffatte dall'influenza del
    Livellatore, Yana e la stessa Marda finiscono per unirsi al Sentiero:
    Marda eredita la spada laser gialla di Kevmo ed emerge come possibile
    futura erede della Madre, mentre il culto fugge a bordo della nave Gaze
    Electric. Il romanzo, primo titolo della Fase II dell'Alta Repubblica
    (ambientata 150 anni prima della Fase I), pone così le basi per il
    conflitto crescente tra Jedi e Sentiero della Mano Aperta nei successivi
    capitoli della saga.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/star-wars-alta-repubblica-il-sentiero-dellinganno.jpg
      alt: "Il Sentiero dell'Inganno - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [il-sentiero-della-vendetta]

- id: convergenza-zoraida-cordova
  titolo: "Convergenza"
  personaggi: [Gella Nattai, Axel Greylark, Xiri A'lbaran, Phan-Tu Zenn, Chancellor Kyong]
  anno: 2022
  edizione: "Star Wars: L'Alta Repubblica (High Republic) - Era del Prequel"
  autori: [Zoraida Córdova]
  link: ""
  fumetti: ""
  trama: >
    Sui pianeti gemelli Eiram ed E'ronoh, un odio reciproco alimenta un
    conflitto che dura da mezzo decennio e minaccia di travolgere i sistemi
    vicini. L'ultima speranza di pace è il matrimonio tra gli eredi delle due
    case reali, Xiri A'lbaran e Phan-Tu Zenn, ma un attentato contro la
    coppia fa ripiombare i due mondi in guerra aperta. La cancelliera affida
    l'indagine alla Cavaliere Jedi Gella Nattai e a suo figlio Axel Greylark,
    i quali scoprono che dietro il complotto e il sabotaggio delle barriere
    che tengono a freno le maree letali di Eiram si cela il Sentiero della
    Mano Aperta, la setta anti-Jedi già emersa nella crisi della Grande
    Divisione. Il colpo di scena centrale è che l'artefice del sabotaggio è
    proprio Axel Greylark, segretamente affiliato alla setta, che tenta di
    far naufragare le nozze e la pace; scoperto da Gella, viene affrontato e
    infine arrestato. Il matrimonio tra Xiri e Phan-Tu viene comunque
    celebrato, sancendo la fine formale del conflitto tra Eiram ed E'ronoh,
    ma la scoperta del tradimento di Axel getta un'ombra sulla fiducia tra
    Repubblica e Jedi. La vicenda prepara così il terreno per l'espansione
    del Sentiero della Mano Aperta come minaccia crescente nel resto della
    saga dell'Alta Repubblica.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/convergenza-zoraida-cordova.jpg
      alt: "Convergenza - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [cataclisma-lydia-kang]

- id: la-battaglia-di-jedha
  titolo: "La Battaglia di Jedha"
  personaggi: [Maestro Creighton Sun, Cavaliere Jedi Aida Forte, "Ambasciatore Tintak (E'ronoh)", La Madre, Tilson]
  anno: 2023
  edizione: "Star Wars: L'Alta Repubblica (High Republic)"
  autori: [George Mann]
  link: ""
  fumetti: "audiodramma/script book"
  trama: >
    Dopo la fine della Guerra Infinita tra Eiram ed E'ronoh, il Maestro Jedi
    Creighton Sun e la Cavaliera Aida Forte accompagnano le delegazioni dei
    due pianeti su Jedha per firmare un trattato di pace durante il Festival
    dell'Equilibrio, sperando di farne un simbolo di unità per la galassia. Ma
    non tutti accolgono di buon grado il coinvolgimento dei Jedi: circolano
    voci secondo cui i Jedi porterebbero con sé la guerra, e le tensioni
    covano sotto la superficie della festa. La situazione esplode quando un
    uomo su uno speeder bike si schianta attraverso la finestra della sala
    delle trattative e uccide a colpi di blaster l'ambasciatore di E'ronoh,
    Tintak; la delegazione di E'ronoh, credendo responsabile Eiram, attacca le
    sue guardie, che rispondono al fuoco, e lo scontro degenera in rivolta,
    dando così inizio alla Battaglia di Jedha. Nel caos, l'enigmatica figura
    nota come la Madre si rivela manipolatrice: Tilson, un suo pedina che
    aveva creduto di agire per suo conto, corre da lei in cerca di
    protezione, ma lei lo uccide a sangue freddo, non avendo più bisogno di
    lui. Il conflitto viene infine domato dall'intervento dei Jedi, che
    riescono a sedare la rivolta prima che degeneri in una guerra aperta, ma
    il trattato di pace ne esce gravemente compromesso, lasciando presagire
    nuove tensioni tra Eiram ed E'ronoh e ulteriori intrighi legati alla
    misteriosa Madre nel prosieguo della saga dell'Alta Repubblica.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/la-battaglia-di-jedha.jpg
      alt: "La Battaglia di Jedha - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: []

- id: cataclisma-lydia-kang
  titolo: "Cataclisma"
  personaggi: [Yaddle, Gella Nattai, Axel Greylark, Xiri A'lbaran, Phan-tu Zenn, "La Madre (Path of the Open Hand)"]
  anno: 2023
  edizione: "Star Wars: L'Alta Repubblica (High Republic) - Fase II"
  autori: [Lydia Kang]
  link: ""
  fumetti: ""
  trama: >
    Dopo il crollo del trattato di pace tra Eiram ed E'ronoh, i Jedi - tra cui
    Yaddle e la giovane Cavaliere Gella Nattai - scoprono che il caos è
    orchestrato dal Path of the Open Hand, il culto guidato dall'enigmatica
    Madre che odia la Forza e i Jedi. L'indagine porta alla luce l'esistenza
    del Leveler, una creatura misteriosa capace di consumare le vittime
    riducendole in polvere, e rivela il legame diretto tra il Path e ciò che
    diventerà la minaccia dei Nihil. Il conflitto degenera nella sanguinosa
    Battaglia di Dalna, lo scontro più devastante mai affrontato dai Jedi
    dell'Alta Repubblica fino a quel momento, con perdite pesanti tra le loro
    fila. Alla fine i principi Xiri A'lbaran e Phan-tu Zenn riescono a
    consolidare una pace fragile tra i loro mondi, ma il Path viene solo
    disperso, non distrutto. Il libro chiude così la Fase II della saga
    gettando le basi per l'ascesa di Marchion Ro e la nascita dei Nihil che
    minacceranno la Repubblica nella Fase I.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/cataclisma-lydia-kang.jpg
      alt: "Cataclisma - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [il-sentiero-della-vendetta, convergenza-zoraida-cordova]

- id: il-sentiero-della-vendetta
  titolo: "Il Sentiero della Vendetta"
  personaggi: [Marda Ro, Yana Ro, "Elecia Zeveron (la Madre)", Oliviah Zeveron]
  anno: 2023
  edizione: "Star Wars: L'Alta Repubblica (High Republic) - Fase II"
  autori: [Cavan Scott]
  link: ""
  trama: >
    Seguito de "Il Sentiero dell'Inganno", il romanzo segue le cugine Marda e
    Yana Ro, divise dalla fede all'interno del Sentiero della Mano Aperta, la
    setta guidata dalla carismatica Madre (in realtà Elecia Zeveron) che vuole
    impedire a chiunque, Jedi compresi, di usare la Forza. Mentre la battaglia
    di Jedha infuria sullo sfondo, Marda parte per il misterioso Pianeta X in
    cerca di altre creature da usare contro i Jedi, mentre Yana stringe
    un'alleanza inattesa per strappare il controllo della setta alla Madre.
    Nella resa dei conti dopo la battaglia di Dalna, Marda si introduce di
    nascosto nella tenda dove la Madre ferita viene curata e la uccide con il
    Livellatore, la stessa arma-creatura che la setta aveva usato contro i
    Jedi. Con questo gesto Marda rovescia il culto e ne diventa la nuova
    guida, ribattezzandolo Sentiero del Pugno Chiuso, mentre Yana resta
    segnata dal tradimento della cugina. Il romanzo chiude così la Fase II
    dell'Alta Repubblica e getta le basi per l'ascesa di Marchion Ro e per gli
    eventi della Fase III.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/il-sentiero-della-vendetta.jpg
      alt: "Il Sentiero della Vendetta - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [star-wars-alta-repubblica-il-sentiero-dellinganno, cataclisma-lydia-kang]

- id: occhio-delloscurita-mann
  titolo: "L'Occhio dell'Oscurità"
  personaggi: [Avar Kriss, Elzar Mann, Bell Zettifar, Marchion Ro, Lina Soh, Ghirra Starros, Pra-Tre Veter]
  anno: 2023
  edizione: "Star Wars: L'Alta Repubblica (High Republic) - Fase III"
  autori: [George Mann]
  link: ""
  trama: >
    Un anno dopo la distruzione della Starlight Beacon, la galassia resta
    divisa dal Murotempesta (Stormwall), la barriera impenetrabile con cui i
    Nihil di Marchion Ro isolano l'Occlusion Zone, dove i suoi seguaci
    saccheggiano i mondi rimasti tagliati fuori dalla Repubblica. Dentro la
    barriera, Avar Kriss e altri Jedi intrappolati lottano per proteggere le
    popolazioni civili mentre restano braccati dai terrificanti Senzanome,
    creature capaci di annullare la connessione dei Jedi con la Forza; nello
    scontro il Maestro Jedi Pra-Tre Veter viene catturato ed eseguito da
    queste creature, un colpo durissimo per l'Ordine. Fuori dal muro, Elzar
    Mann e Bell Zettifar collaborano con la Repubblica della Cancelliera Lina
    Soh nel tentativo, sempre fallito, di forzare o comunicare attraverso lo
    Stormwall, mentre Ghirra Starros cerca di imporre un minimo di ordine
    politico nel caos lasciato dai Nihil. Il romanzo si chiude senza abbattere
    la barriera: la separazione tra le due metà della galassia resta di fatto
    irrisolta, ma alcune rivelazioni sulla natura dei Senzanome e sui rapporti
    di forza tra Jedi, Repubblica e Nihil apparecchiano il terreno per gli
    sviluppi della Fase III dell'Alta Repubblica.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/occhio-delloscurita-mann.jpg
      alt: "L'Occhio dell'Oscurità - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [la-stella-caduta, sfidare-la-tempesta]

- id: sfidare-la-tempesta
  titolo: "Sfidare la Tempesta"
  personaggi: [Vernestra Rwoh, Avon Starros, Imri Cantaros, Jordanna Sparkburn, Xylan Graf, Sylvestri Yarrow]
  anno: 2024
  edizione: "Star Wars Romanzi: L'Alta Repubblica (Panini Comics)"
  autori: [Tessa Gratton, Justina Ireland]
  link: ""
  fumetti: "Sfidare la Tempesta"
  trama: >
    Dopo la distruzione di Starlight Station, i Nihil hanno eretto il Muro di
    Tempesta, una barriera che isola un'intera regione della galassia nella
    cosiddetta Zona di Occlusione, lasciando i suoi abitanti in ostaggio del
    loro controllo. Il Cavaliere Jedi Vernestra Rwoh, convinta che il suo
    Padawan Imri Cantaros sia morto nell'attacco, si è ritirata su un mondo
    pacifico per curare le proprie ferite, ma la sua amica Avon Starros
    scopre che Imri è invece sopravvissuto proprio all'interno della Zona di
    Occlusione. Vernestra accetta allora di guidare una missione di
    salvataggio insieme a Jordanna Sparkburn e all'inaffidabile Xylan Graf,
    tentando di superare il Muro di Tempesta mentre nella regione si
    moltiplicano gli avvistamenti dei terribili Senza Nome e una misteriosa
    piaga che ne ricorda gli effetti letali. Nel corso della missione emerge
    che i poteri della Forza di Vernestra si rivelano paradossalmente un
    ostacolo contro queste creature, e vengono a galla le vere, ambigue
    motivazioni di Avon. La storia si risolve salvando Imri ma lasciando la
    Zona di Occlusione e la minaccia dei Senza Nome ancora aperte, gettando
    le basi per gli sviluppi successivi della saga dell'Alta Repubblica
    contro i Nihil.
  saga: alta-repubblica
  immagini:
    - src: /assets/img/starwars/sfidare-la-tempesta.jpg
      alt: "Sfidare la Tempesta - copertina"
    # TODO: aggiungere immagini in /assets/img/starwars/
  collegate: [occhio-delloscurita-mann, una-prova-di-coraggio]
