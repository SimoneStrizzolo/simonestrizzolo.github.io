<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <!--
    Template board Catan 4 giocatori (19 hex, righe 3-4-5-4-3), ricostruito da imm2.png.
    Stessa griglia/geometria di catan-board-4p-template.svg (esagoni "pointy-top",
    punta in alto/basso, lati verticali piatti a sx/dx) — cambiano solo risorse e numeri.

    Parametri: r=50, hexWidth(=r*sqrt(3))=86.60, passo verticale=1.5*r=75,
    centro board (340,340), centerRow=2.
  -->
  <defs>
    <style>
      .tile { stroke: #2c2c2c; stroke-width: 2; }
      .token { fill: #F7F1DE; stroke: #2c2c2c; stroke-width: 1.5; }
      .token-num { font-weight: 700; font-size: 22px; text-anchor: middle; }
      .token-num.hot { fill: #B3231C; }
      .token-num.cold { fill: #1a1a1a; }
      .pip { r: 1.8; }
      .pip.hot { fill: #B3231C; }
      .pip.cold { fill: #1a1a1a; }
    </style>
  </defs>

  <!-- Oceano -->
  <circle cx="340" cy="340" r="320" fill="#6EC6E8" />

  <!-- ============== HEX (righe 3-4-5-4-3) ============== -->
  <g class="hexes">

    <!-- Row 0 -->
    <g class="hex" data-row="0" data-col="0" data-resource="Forest" data-number="6">
      <polygon class="tile" points="253.40,140.00 296.70,165.00 296.70,215.00 253.40,240.00 210.10,215.00 210.10,165.00" fill="#2E5339" />
      <circle class="token" cx="253.40" cy="190.00" r="22" />
      <text class="token-num hot" x="253.40" y="198.00">6</text>
      <circle class="pip hot" cx="239.40" cy="203.00" /><circle class="pip hot" cx="246.40" cy="203.00" /><circle class="pip hot" cx="253.40" cy="203.00" /><circle class="pip hot" cx="260.40" cy="203.00" /><circle class="pip hot" cx="267.40" cy="203.00" />
    </g>
    <g class="hex" data-row="0" data-col="1" data-resource="Ore" data-number="3">
      <polygon class="tile" points="340.00,140.00 383.30,165.00 383.30,215.00 340.00,240.00 296.70,215.00 296.70,165.00" fill="#ACACA6" />
      <circle class="token" cx="340.00" cy="190.00" r="22" />
      <text class="token-num cold" x="340.00" y="198.00">3</text>
      <circle class="pip cold" cx="336.50" cy="203.00" /><circle class="pip cold" cx="343.50" cy="203.00" />
    </g>
    <g class="hex" data-row="0" data-col="2" data-resource="Sheep" data-number="10">
