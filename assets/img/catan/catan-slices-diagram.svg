<svg viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <!--
    Diagramma esplicativo: la board standard (19 hex) viene tagliata da 3 linee
    immaginarie, ciascuna passante per il centro e ruotata di 60° rispetto
    alle altre (gli assi di simmetria dell'esagono). Ogni linea, presa da sola,
    divide la board in due metà (Gruppo A / Gruppo B): per ognuna delle 3 linee
    si contano le risorse a sinistra e a destra e si confrontano — da qui
    "sei fette" (3 linee x 2 lati).
    Geometria hex: stessa formula dei render principali, con r=30 (hexWidth=51.96, passo riga=45).
  -->
  <defs>
    <g id="hexgrid">
      <polygon points="-51.96,-120 -25.98,-105 -25.98,-75 -51.96,-60 -77.94,-75 -77.94,-105" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="0,-120 25.98,-105 25.98,-75 0,-60 -25.98,-75 -25.98,-105" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="51.96,-120 77.94,-105 77.94,-75 51.96,-60 25.98,-75 25.98,-105" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="-77.94,-75 -51.96,-60 -51.96,-30 -77.94,-15 -103.92,-30 -103.92,-60" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="-25.98,-75 0,-60 0,-30 -25.98,-15 -51.96,-30 -51.96,-60" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="25.98,-75 51.96,-60 51.96,-30 25.98,-15 0,-30 0,-60" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="77.94,-75 103.92,-60 103.92,-30 77.94,-15 51.96,-30 51.96,-60" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="-103.92,-30 -77.94,-15 -77.94,15 -103.92,30 -129.90,15 -129.90,-15" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="-51.96,-30 -25.98,-15 -25.98,15 -51.96,30 -77.94,15 -77.94,-15" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="0,-30 25.98,-15 25.98,15 0,30 -25.98,15 -25.98,-15" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="51.96,-30 77.94,-15 77.94,15 51.96,30 25.98,15 25.98,-15" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="103.92,-30 129.90,-15 129.90,15 103.92,30 77.94,15 77.94,-15" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="-77.94,15 -51.96,30 -51.96,60 -77.94,75 -103.92,60 -103.92,30" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="-25.98,15 0,30 0,60 -25.98,75 -51.96,60 -51.96,30" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="25.98,15 51.96,30 51.96,60 25.98,75 0,60 0,30" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="77.94,15 103.92,30 103.92,60 77.94,75 51.96,60 51.96,30" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="-51.96,60 -25.98,75 -25.98,105 -51.96,120 -77.94,105 -77.94,75" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="0,60 25.98,75 25.98,105 0,120 -25.98,105 -25.98,75" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
      <polygon points="51.96,60 77.94,75 77.94,105 51.96,120 25.98,105 25.98,75" fill="#EFE4B0" stroke="#2c2c2c" stroke-width="1.5" />
    </g>
    <clipPath id="circleClip">
      <circle cx="0" cy="0" r="190" />
    </clipPath>
  </defs>

  <!-- ==================== Board 1: Linea 1 (0°) ==================== -->
  <g transform="translate(220,220)">
    <circle r="190" fill="#6EC6E8" />
    <use href="#hexgrid" />
    <g clip-path="url(#circleClip)">
      <rect x="-190" y="-190" width="190" height="380" fill="#3B78C2" opacity="0.35" />
      <rect x="0" y="-190" width="190" height="380" fill="#E08E45" opacity="0.35" />
    </g>
    <line x1="0" y1="-190" x2="0" y2="190" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="8,5" />
    <circle r="190" fill="none" stroke="#2c2c2c" stroke-width="2" />
  </g>
  <text x="220" y="435" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Linea 1</text>

  <!-- ==================== Board 2: Linea 2 (60°) ==================== -->
  <g transform="translate(640,220)">
    <circle r="190" fill="#6EC6E8" />
    <use href="#hexgrid" />
    <g transform="rotate(60)" clip-path="url(#circleClip)">
      <rect x="-190" y="-190" width="190" height="380" fill="#3B78C2" opacity="0.35" />
      <rect x="0" y="-190" width="190" height="380" fill="#E08E45" opacity="0.35" />
    </g>
    <line x1="0" y1="-190" x2="0" y2="190" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="8,5" transform="rotate(60)" />
    <circle r="190" fill="none" stroke="#2c2c2c" stroke-width="2" />
  </g>
  <text x="640" y="435" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Linea 2</text>

  <!-- ==================== Board 3: Linea 3 (-60°) ==================== -->
  <g transform="translate(1060,220)">
    <circle r="190" fill="#6EC6E8" />
    <use href="#hexgrid" />
    <g transform="rotate(-60)" clip-path="url(#circleClip)">
      <rect x="-190" y="-190" width="190" height="380" fill="#3B78C2" opacity="0.35" />
      <rect x="0" y="-190" width="190" height="380" fill="#E08E45" opacity="0.35" />
    </g>
    <line x1="0" y1="-190" x2="0" y2="190" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="8,5" transform="rotate(-60)" />
    <circle r="190" fill="none" stroke="#2c2c2c" stroke-width="2" />
  </g>
  <text x="1060" y="435" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">Linea 3</text>

  <!-- Legenda -->
  <rect x="520" y="452" width="18" height="18" fill="#3B78C2" opacity="0.55" />
  <text x="544" y="466" font-size="18" fill="#1a1a1a">Gruppo A</text>
  <rect x="660" y="452" width="18" height="18" fill="#E08E45" opacity="0.55" />
  <text x="684" y="466" font-size="18" fill="#1a1a1a">Gruppo B</text>
</svg>
