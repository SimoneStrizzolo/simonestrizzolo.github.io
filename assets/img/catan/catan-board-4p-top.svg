    </g>
    <g class="hex" data-row="3" data-col="2" data-resource="Wheat" data-number="9">
      <polygon class="tile" points="383.30,365.00 426.60,390.00 426.60,440.00 383.30,465.00 340.00,440.00 340.00,390.00" fill="#F2C94C" />
      <circle class="token" cx="383.30" cy="415.00" r="22" />
      <text class="token-num cold" x="383.30" y="423.00">9</text>
      <circle class="pip cold" cx="372.80" cy="428.00" /><circle class="pip cold" cx="379.80" cy="428.00" /><circle class="pip cold" cx="386.80" cy="428.00" /><circle class="pip cold" cx="393.80" cy="428.00" />
