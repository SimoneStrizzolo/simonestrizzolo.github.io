    <g class="hex" data-row="4" data-col="1" data-resource="Sheep" data-number="6">
      <polygon class="tile" points="340.00,440.00 383.30,465.00 383.30,515.00 340.00,540.00 296.70,515.00 296.70,465.00" fill="#8FCB4E" />
      <circle class="token" cx="340.00" cy="490.00" r="22" />
      <text class="token-num hot" x="340.00" y="498.00">6</text>
      <circle class="pip hot" cx="326.00" cy="503.00" /><circle class="pip hot" cx="333.00" cy="503.00" /><circle class="pip hot" cx="340.00" cy="503.00" /><circle class="pip hot" cx="347.00" cy="503.00" /><circle class="pip hot" cx="354.00" cy="503.00" />
    </g>
    <g class="hex" data-row="4" data-col="2" data-resource="Sheep" data-number="10">
