    </g>
    <g class="hex" data-row="3" data-col="1" data-resource="Forest" data-number="3">
      <polygon class="tile" points="296.70,365.00 340.00,390.00 340.00,440.00 296.70,465.00 253.40,440.00 253.40,390.00" fill="#2E5339" />
      <circle class="token" cx="296.70" cy="415.00" r="22" />
      <text class="token-num cold" x="296.70" y="423.00">3</text>
