      <text class="token-num hot" x="253.40" y="348.00">8</text>
      <circle class="pip hot" cx="239.40" cy="353.00" /><circle class="pip hot" cx="246.40" cy="353.00" /><circle class="pip hot" cx="253.40" cy="353.00" /><circle class="pip hot" cx="260.40" cy="353.00" /><circle class="pip hot" cx="267.40" cy="353.00" />
