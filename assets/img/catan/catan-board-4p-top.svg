      <text class="token-num hot" x="469.90" y="423.00">6</text>
      <circle class="pip hot" cx="455.90" cy="428.00" /><circle class="pip hot" cx="462.90" cy="428.00" /><circle class="pip hot" cx="469.90" cy="428.00" /><circle class="pip hot" cx="476.90" cy="428.00" /><circle class="pip hot" cx="483.90" cy="428.00" />
