    <!-- Row 4 -->
    <g class="hex" data-row="4" data-col="0" data-resource="Ore" data-number="11">
      <polygon class="tile" points="253.40,440.00 296.70,465.00 296.70,515.00 253.40,540.00 210.10,515.00 210.10,465.00" fill="#ACACA6" />
      <circle class="token" cx="253.40" cy="490.00" r="22" />
      <text class="token-num cold" x="253.40" y="498.00">11</text>
      <circle class="pip cold" cx="249.90" cy="503.00" /><circle class="pip cold" cx="256.90" cy="503.00" />
