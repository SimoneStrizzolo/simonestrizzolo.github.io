      <circle class="token" cx="340.00" cy="340.00" r="22" />
      <text class="token-num cold" x="340.00" y="348.00">10</text>
      <circle class="pip cold" cx="333.00" cy="353.00" /><circle class="pip cold" cx="340.00" cy="353.00" /><circle class="pip cold" cx="347.00" cy="353.00" />
    </g>
    <g class="hex" data-row="2" data-col="3" data-resource="Sheep" data-number="5">
      <polygon class="tile" points="426.60,290.00 469.90,315.00 469.90,365.00 426.60,390.00 383.30,365.00 383.30,315.00" fill="#8FCB4E" />
      <circle class="token" cx="426.60" cy="340.00" r="22" />
      <text class="token-num cold" x="426.60" y="348.00">5</text>
      <circle class="pip cold" cx="416.10" cy="353.00" /><circle class="pip cold" cx="423.10" cy="353.00" /><circle class="pip cold" cx="430.10" cy="353.00" /><circle class="pip cold" cx="437.10" cy="353.00" />
    </g>
    <g class="hex" data-row="2" data-col="4" data-resource="Sheep" data-number="4">
      <polygon class="tile" points="513.20,290.00 556.50,315.00 556.50,365.00 513.20,390.00 469.90,365.00 469.90,315.00" fill="#8FCB4E" />
      <circle class="token" cx="513.20" cy="340.00" r="22" />
      <text class="token-num cold" x="513.20" y="348.00">4</text>
      <circle class="pip cold" cx="506.20" cy="353.00" /><circle class="pip cold" cx="513.20" cy="353.00" /><circle class="pip cold" cx="520.20" cy="353.00" />
    </g>

    <!-- Row 3 -->
    <g class="hex" data-row="3" data-col="0" data-resource="Forest" data-number="3">
      <polygon class="tile" points="210.10,365.00 253.40,390.00 253.40,440.00 210.10,465.00 166.80,440.00 166.80,390.00" fill="#2E5339" />
      <circle class="token" cx="210.10" cy="415.00" r="22" />
